<style>

  background:#fdf6f0;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.app{
  background:#fff;
  padding:24px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
h1{font-size:22px;margin-bottom:10px}
#counter{font-size:14px;color:#777;margin-bottom:12px}
#question{font-size:18px;margin:22px 0;min-height:90px}
button{
  background:#ff8c8c;
  color:#fff;
  border:none;
  padding:14px 26px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{background:#ccc;cursor:not-allowed}
.info{margin-top:14px;font-size:14px;color:#777}
</style>
</head>

  <h1>💛 Pytanie dla nas</h1>

  <div id="question">Kliknij, aby wylosować pytanie dnia</div>

let unused = JSON.parse(localStorage.getItem("unusedQuestions"));
let lastDate = localStorage.getItem("lastDrawDate");
const today = new Date().toDateString();

if(!unused || unused.length===0){
  unused=[...questions];
  localStorage.setItem("unusedQuestions",JSON.stringify(unused));
}

const usedCount = TOTAL - unused.length;
document.getElementById("counter").innerText =
  `Dzień ${usedCount + 1} / ${TOTAL}`;

if(lastDate===today){
  document.getElementById("drawBtn").disabled=true;
  document.getElementById("info").innerText="Wróć jutro po kolejne pytanie 💛";
}

function drawQuestion(){
  if(unused.length===0){
    document.getElementById("question").innerText="To było ostatnie pytanie 💛";
    document.getElementById("drawBtn").disabled=true;
    return;
  }

  const index=Math.floor(Math.random()*unused.length);
  const q=unused.splice(index,1)[0];

  localStorage.setItem("unusedQuestions",JSON.stringify(unused));
  localStorage.setItem("lastDrawDate",today);

  document.getElementById("question").innerText=q;
  document.getElementById("drawBtn").disabled=true;
  document.getElementById("info").innerText="Wróć jutro po kolejne pytanie 💛";

  const newUsed = TOTAL - unused.length;
  document.getElementById("counter").innerText =
    `Dzień ${newUsed} / ${TOTAL}`;
}
</script>

</body>
</html>
