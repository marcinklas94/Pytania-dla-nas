<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💛 Pytanie dla nas</title>
<style>
body{
  font-family: system-ui, sans-serif;
  background:#fdf6f0;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.app{
  background:#fff;
  padding:24px;
  border-radius:18px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
h1{font-size:22px;margin-bottom:10px}
#counter{font-size:14px;color:#777;margin-bottom:8px}
#remaining{font-size:14px;color:#777;margin-bottom:12px}
#progressBarContainer{
  background:#eee;
  border-radius:10px;
  height:12px;
  width:100%;
  margin-bottom:12px;
  overflow:hidden;
}
#progressBar{
  height:12px;
  background:#ff8c8c;
  width:0%;
  transition: width 0.3s;
}
#question{font-size:18px;margin:22px 0;min-height:90px}
button{
  background:#ff8c8c;
  color:#fff;
  border:none;
  padding:14px 26px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{background:#ccc;cursor:not-allowed}
.info{margin-top:14px;font-size:14px;color:#777}
</style>
</head>
<body>

<div class="app">
  <h1>💛 Pytanie dla nas</h1>
  <div id="counter"></div>
  <div id="remaining"></div>
  <div id="progressBarContainer"><div id="progressBar"></div></div>
  <div id="question">Ładowanie pytania...</div>
  <button id="drawBtn">Losuj pytanie</button>
  <div class="info" id="info"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ====== KONFIGURACJA FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyCXlCQ_63lHlY1--UHHfXfO1HdsviESx1w",
  authDomain: "pytanie-dla-nas.firebaseapp.com",
  databaseURL: "https://pytanie-dla-nas-default-rtdb.firebaseio.com/",
  projectId: "pytanie-dla-nas",
  storageBucket: "pytanie-dla-nas.firebasestorage.app",
  messagingSenderId: "312894256042",
  appId: "1:312894256042:web:794e26062a4e0f155c71d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const TOTAL = 365;
const questionDiv = document.getElementById('question');
const counterDiv = document.getElementById('counter');
const remainingDiv = document.getElementById('remaining');
const progressBar = document.getElementById('progressBar');
const infoDiv = document.getElementById('info');
const drawBtn = document.getElementById('drawBtn');

const today = new Date().toISOString().slice(0,10);

async function loadQuestion(){
  const snapshot = await db.ref('/').get();
  const data = snapshot.val();
  let { questions, unusedIndexes, lastDrawDate, currentIndex } = data;

  if(!questions || questions.length===0){
    questionDiv.textContent="Brak pytań w bazie!";
    drawBtn.disabled=true;
    return;
  }

  if(lastDrawDate === today && currentIndex !== undefined){
    // Już wylosowane dzisiaj
    questionDiv.textContent = questions[currentIndex];
    drawBtn.disabled = true;
    infoDiv.textContent = "Wróć jutro po kolejne pytanie 💛";
  } else {
    drawBtn.disabled = false;
    infoDiv.textContent = "";
    questionDiv.textContent = "Kliknij, aby wylosować pytanie dnia";
  }

  updateCounter(unusedIndexes);

  drawBtn.onclick = async function(){
    if(unusedIndexes.length === 0){
      unusedIndexes = Array.from({length: questions.length}, (_, i) => i);
    }
    const randomIdx = Math.floor(Math.random() * unusedIndexes.length);
    const questionIndex = unusedIndexes[randomIdx];

    unusedIndexes.splice(randomIdx,1);

    await db.ref('/').update({
      unusedIndexes: unusedIndexes,
      lastDrawDate: today,
      currentIndex: questionIndex
    });

    questionDiv.textContent = questions[questionIndex];
    drawBtn.disabled = true;
    infoDiv.textContent = "Wróć jutro po kolejne pytanie 💛";

    updateCounter(unusedIndexes);
  };
}

function updateCounter(unusedIndexes){
  const used = TOTAL - unusedIndexes.length;
  counterDiv.textContent = `Dzień ${used} / ${TOTAL}`;
  remainingDiv.textContent = `Pozostało pytań: ${unusedIndexes.length}`;
  const progressPercent = (used / TOTAL) * 100;
  progressBar.style.width = `${progressPercent}%`;
}

loadQuestion();
</script>

</body>
</html>
