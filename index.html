// Inicjalizacja zmiennych
let unusedIndexes = [];
let lastDrawDate = "";

// Pobranie stanu z bazy
db.ref("/").once("value").then(snapshot=>{
  const data = snapshot.val();
  if(data){
    unusedIndexes = data.unusedIndexes;
    lastDrawDate = data.lastDrawDate;
    updateUI();
  } else {
    // Pierwsze uruchomienie – wypełniamy bazę
    unusedIndexes = questions.map((_,i)=>i);
    db.ref("/").set({questions, unusedIndexes, lastDrawDate: ""});
    updateUI();
  }
});

// Funkcja aktualizacji UI
function updateUI(question){
  const usedCount = questions.length - unusedIndexes.length;
  document.getElementById("counter").innerText = `Dzień ${usedCount + 1} / ${questions.length}`;
  if(question) document.getElementById("question").innerText = question;
  const today = new Date().toISOString().slice(0,10);
  if(lastDrawDate === today){
    document.getElementById("drawBtn").disabled = true;
    document.getElementById("info").innerText = "Wróć jutro po kolejne pytanie 💛";
  } else {
    document.getElementById("drawBtn").disabled = false;
    document.getElementById("info").innerText = "";
  }
}

// Funkcja losowania pytania
function drawQuestion(){
  const today = new Date().toISOString().slice(0,10);
  if(lastDrawDate === today){
    alert("Wróć jutro po kolejne pytanie 💛");
    return;
  }
  if(unusedIndexes.length === 0){
    alert("To było ostatnie pytanie 💛");
    return;
  }

  const idx = Math.floor(Math.random()*unusedIndexes.length);
  const qIndex = unusedIndexes.splice(idx,1)[0];
  const question = questions[qIndex];
  lastDrawDate = today;

  // zapis w bazie
  db.ref("/").set({questions, unusedIndexes, lastDrawDate});

  updateUI(question);
}

// Reset postępu
function resetProgress(){
  if(confirm("Na pewno chcesz zresetować postęp i zacząć od Dnia 1?")){
    unusedIndexes = questions.map((_,i)=>i);
    lastDrawDate = "";
    db.ref("/").set({questions, unusedIndexes, lastDrawDate});
    updateUI();
  }
}
